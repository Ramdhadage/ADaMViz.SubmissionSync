name: License report 🗃

on:
  workflow_call:
    inputs:
      package-subdirectory:
        description: Subdirectory in the repository, where the R package is located.
        required: false
        type: string
        default: "."

concurrency:
  group: licenses-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    runs-on: ubuntu-24.04
    name: Check 🚩
    container:
      image: ghcr.io/insightsengineering/rstudio@sha256:b7fce5f56d0f979f33304b8d74ab878fd4f78db81278aeedc3a8ad6f22e86428
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "true"

    steps:
      - name: Checkout repo (PR) 🛎
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Checkout repo 🛎
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: github.event_name != 'pull_request'
        with:
          ref: ${{ github.sha }}

      - name: Restore scanner dependencies
        run: |
          renv::restore(prompt = FALSE)
          stopifnot(requireNamespace("jsonlite", quietly = TRUE))
        shell: Rscript {0}
        working-directory: ${{ inputs.package-subdirectory }}

      - name: Generate license report 📜
        run: |
          description <- read.dcf("DESCRIPTION")
          fields <- intersect(c("Depends", "Imports"), colnames(description))
          direct <- trimws(unlist(strsplit(paste(description[1, fields], collapse = ","), ",")))
          direct <- setdiff(sub("\\s*\\(.*", "", direct), c("R", ""))
          installed <- installed.packages(fields = "License")
          dependencies <- unique(c(direct, unlist(tools::package_dependencies(
            direct, db = installed, which = c("Depends", "Imports", "LinkingTo"),
            recursive = TRUE
          ))))
          missing <- setdiff(dependencies, rownames(installed))
          if (length(missing)) stop("License metadata unavailable: ", paste(missing, collapse = ", "))
          report <- as.data.frame(installed[dependencies, c("Package", "Version", "License"), drop = FALSE])
          if (!nrow(report) || anyNA(report$License) || any(!nzchar(report$License))) {
            stop("License scan returned incomplete results")
          }
          print(report, row.names = FALSE)
          write.csv(report, "license-report.csv", row.names = FALSE)
          writeLines(jsonlite::toJSON(report, dataframe = "rows", pretty = TRUE), "license-report.json")
          if (any(grepl("^AGPL.*", report$License))) {
            stop("AGPL dependency licenses require review")
          }
        shell: Rscript {0}
        working-directory: ${{ inputs.package-subdirectory }}

      - name: Upload license results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-report
          path: |
            ${{ inputs.package-subdirectory }}/license-report.csv
            ${{ inputs.package-subdirectory }}/license-report.json
          if-no-files-found: error
