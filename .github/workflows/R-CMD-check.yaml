name: R-CMD-check

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev libgit2-dev libnode-dev libx11-dev pandoc
      - uses: r-lib/actions/setup-renv@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
            any::rcmdcheck
      - name: Document package
        run: Rscript -e 'roxygen2::roxygenise()'
      - name: Run tests
        run: Rscript -e 'testthat::test_local(reporter = "summary")'
      - name: Check package
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")'
