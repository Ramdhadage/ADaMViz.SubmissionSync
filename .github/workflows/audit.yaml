name: Audit Dependencies 🕵️‍♀️

on:
  workflow_call:
    secrets:
      OSSINDEX_USER:
        required: true
      OSSINDEX_TOKEN:
        required: true
    inputs:
      package-subdirectory:
        description: Subdirectory in the repository, where the R package is located.
        required: false
        type: string
        default: "."
      allow-failure:
        description: Allow vulnerability findings; scanner errors always fail.
        required: false
        type: boolean
        default: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/insightsengineering/rstudio@sha256:b7fce5f56d0f979f33304b8d74ab878fd4f78db81278aeedc3a8ad6f22e86428
    name: oysteR scan 🦪
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - name: Checkout repo (PR) 🛎
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 1

      - name: Checkout repo 🛎
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: github.event_name != 'pull_request'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Apply Ubuntu curl security updates
        run: |
          apt-get update
          apt-get install --yes --only-upgrade curl libcurl4t64 libcurl4-openssl-dev
          # Ubuntu Noble backports CVE-2026-18924's fix in revision .15.
          # https://ubuntu.com/security/CVE-2026-18924
          for package in curl libcurl4t64 libcurl4-openssl-dev; do
            installed_version=$(dpkg-query -W -f='${Version}' "$package")
            dpkg --compare-versions "$installed_version" ge 8.5.0-2ubuntu10.15
          done
        shell: bash

      - name: Install pinned audit tool
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          renv::restore(prompt = FALSE)
          renv::install("sonatype-nexus-community/oysteR@8e25ba01fbc6b783bdc0fb5514442d6a8b6e1066")
        shell: Rscript {0}
        env:
          RENV_CONFIG_AUTOLOADER_ENABLED: "true"
          GITHUB_PAT: ${{ github.token }}
        working-directory: ${{ inputs.package-subdirectory }}

      - name: Report linked libcurl and system package versions
        run: |
          print(packageVersion("curl"))
          runtime <- curl::curl_version()
          print(runtime)
          system2("dpkg-query", c("-W", "curl", "libcurl4t64", "libcurl4-openssl-dev"))
          # These exceptions apply only to Ubuntu Noble's patched system libcurl.
          os <- readLines("/etc/os-release")
          linkage <- system2("ldd", shQuote(getLoadedDLLs()[["curl"]][["path"]]), stdout = TRUE)
          libcurl <- grep("^\\s*libcurl\\.so\\.4 => /", linkage, value = TRUE)
          stopifnot(length(libcurl) == 1L)
          libcurl <- normalizePath(sub("^.* => ([^ ]+) .*", "\\1", libcurl), mustWork = TRUE)
          owner <- system2("dpkg-query", c("-S", shQuote(libcurl)), stdout = TRUE)
          version <- system2("dpkg-query", c("-W", shQuote("-f=${Version}"), "libcurl4t64"), stdout = TRUE)
          stopifnot(all(c("ID=ubuntu", "VERSION_CODENAME=noble") %in% os),
                    identical(runtime$version, "8.5.0"), isTRUE(startsWith(runtime$libssh_version, "libssh/")),
                    length(owner) == 1L, startsWith(owner, "libcurl4t64:"),
                    length(version) == 1L, grepl("^8[.]5[.]0-2ubuntu10[.][0-9]+$", version),
                    system2("dpkg", c("--compare-versions", version, "ge", "8.5.0-2ubuntu10.15")) == 0L)
          cat("CURL_NOBLE_REVIEWED=true\n", file = Sys.getenv("GITHUB_ENV"), append = TRUE)
        shell: Rscript {0}
        env:
          RENV_CONFIG_AUTOLOADER_ENABLED: "true"
        working-directory: ${{ inputs.package-subdirectory }}

      - name: Run oysteR scan on dependencies 🔍
        env:
          OSSINDEX_USER: ${{ secrets.OSSINDEX_USER }}
          OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
          RENV_CONFIG_AUTOLOADER_ENABLED: "true"
          ALLOW_FINDINGS: ${{ inputs.allow-failure }}
        run: |
          dependencies_scan <- oysteR::audit_description(
            dir = ".",
            fields = c("Depends", "Imports", "Suggests"),
            verbose = TRUE
          )
          print(dependencies_scan)
          print(as.data.frame(dependencies_scan[
            which(dependencies_scan$no_of_vulnerabilities > 0),
          ]), row.names = FALSE)
          saveRDS(dependencies_scan, "audit-description.rds")
          stopifnot(is.data.frame(dependencies_scan), nrow(dependencies_scan) > 0L,
                    "no_of_vulnerabilities" %in% names(dependencies_scan))
          if (anyNA(dependencies_scan$no_of_vulnerabilities)) {
            stop("Dependency audit returned incomplete vulnerability results")
          }
          remaining <- dependencies_scan$no_of_vulnerabilities
          if (Sys.getenv("CURL_NOBLE_REVIEWED") == "true") {
            # Ubuntu's CVE tracker: Noble fixes the first two in .15/.8; libssh is unaffected by the others.
            reviewed <- c("CVE-2026-18924", "CVE-2026-3783", "CVE-2026-86410", "CVE-2026-87865")
            for (i in which(dependencies_scan$oss_package == "pkg:cran/curl@8.1.0")) {
              stopifnot(length(dependencies_scan$vulnerabilities[[i]]) == remaining[i])
              remaining[i] <- remaining[i] - sum(vapply(dependencies_scan$vulnerabilities[[i]],
                function(v) isTRUE(v$id %in% reviewed), logical(1)))
            }
          }
          message("Unresolved vulnerability findings after Noble review: ", sum(remaining))
          if (any(remaining > 0) &&
              Sys.getenv("ALLOW_FINDINGS") != "true") {
            stop("Vulnerabilities found in DESCRIPTION dependencies")
          }
        shell: Rscript {0}
        working-directory: ${{ inputs.package-subdirectory }}

      - name: Run oysteR scan on renv.lock 🔒
        if: ${{ !cancelled() }}
        env:
          OSSINDEX_USER: ${{ secrets.OSSINDEX_USER }}
          OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
          RENV_CONFIG_AUTOLOADER_ENABLED: "true"
          ALLOW_FINDINGS: ${{ inputs.allow-failure }}
        run: |
          if (file.exists("renv.lock")) {
            renv_lock_scan <- oysteR::audit_renv_lock(dir = ".", verbose = TRUE)
            print(renv_lock_scan)
            print(as.data.frame(renv_lock_scan[
              which(renv_lock_scan$no_of_vulnerabilities > 0),
            ]), row.names = FALSE)
            saveRDS(renv_lock_scan, "audit-renv-lock.rds")
            stopifnot(is.data.frame(renv_lock_scan), nrow(renv_lock_scan) > 0L,
                      "no_of_vulnerabilities" %in% names(renv_lock_scan))
            if (anyNA(renv_lock_scan$no_of_vulnerabilities)) {
              stop("Lockfile audit returned incomplete vulnerability results")
            }
            remaining <- renv_lock_scan$no_of_vulnerabilities
            if (Sys.getenv("CURL_NOBLE_REVIEWED") == "true") {
              # Ubuntu's CVE tracker: Noble fixes the first two in .15/.8; libssh is unaffected by the others.
              reviewed <- c("CVE-2026-18924", "CVE-2026-3783", "CVE-2026-86410", "CVE-2026-87865")
              for (i in which(renv_lock_scan$oss_package == "pkg:cran/curl@8.1.0")) {
                stopifnot(length(renv_lock_scan$vulnerabilities[[i]]) == remaining[i])
                remaining[i] <- remaining[i] - sum(vapply(renv_lock_scan$vulnerabilities[[i]],
                  function(v) isTRUE(v$id %in% reviewed), logical(1)))
              }
            }
            message("Unresolved vulnerability findings after Noble review: ", sum(remaining))
            if (any(remaining > 0) &&
                Sys.getenv("ALLOW_FINDINGS") != "true") {
              stop("Vulnerabilities found in locked dependencies")
            }
          } else {
            message("No renv.lock file, not scanning.")
          }
        shell: Rscript {0}
        working-directory: ${{ inputs.package-subdirectory }}

      - name: Upload audit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: ${{ inputs.package-subdirectory }}/audit-*.rds
          if-no-files-found: error
