<svg xmlns="http://www.w3.org/2000/svg" width="840" height="436" viewBox="0 0 840 436" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">First POC workflow</title>
  <desc id="workflow-desc">A six-stage process showing the clinical scientist, application services, execution worker, and independent reviewers from permitted BDS CSV upload through controlled export.</desc>
  <defs>
    <pattern id="workflow-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/></pattern>
    <marker id="workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <style>
    .paper { fill: #f5f5f5; }
    .ink { fill: #2d3142; }
    .muted { fill: #4f5d75; }
    .soft { fill: #7a8399; }
    .rule { stroke: rgba(45,49,66,0.12); stroke-width: 0.8; }
    .node { fill: #fff; stroke: rgba(45,49,66,0.25); stroke-width: 1; }
    .node-focus { fill: rgba(235,108,54,0.08); stroke: #eb6c36; stroke-width: 1.5; }
    .role { fill: rgba(45,49,66,0.12); }
    .role-focus { fill: rgba(235,108,54,0.20); }
    .step { fill: rgba(45,49,66,0.12); }
    .step-focus { fill: rgba(235,108,54,0.20); }
    .name { font: 600 9px Geist, system-ui, sans-serif; text-anchor: middle; }
    .sub { font: 400 6.5px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
    .tool { font: 400 6.5px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
    .role-key { font: 600 6px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
    .lane-label { font: 500 8px 'Geist Mono', ui-monospace, monospace; letter-spacing: 0.08em; text-anchor: middle; }
    .step-label { font: 500 6px 'Geist Mono', ui-monospace, monospace; letter-spacing: 0.12em; text-anchor: middle; }
    .legend-label { font: 500 6.5px 'Geist Mono', ui-monospace, monospace; letter-spacing: 0.08em; }
  </style>
  <rect width="840" height="436" class="paper"/>
  <rect width="840" height="436" fill="url(#workflow-dots)" opacity="0.55"/>
  <rect x="140" y="36" width="700" height="80" fill="rgba(45,49,66,0.018)"/>
  <rect x="140" y="196" width="700" height="80" fill="rgba(45,49,66,0.018)"/>
  <path d="M140 36H840 M0 116H840 M0 196H840 M0 276H840 M0 356H840" class="rule" fill="none"/>
  <path d="M140 36V356" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

  <g class="step-head">
    <rect x="190" y="6" width="16" height="16" rx="8" class="step"/><text x="198" y="17" class="step-label ink">1</text><text x="198" y="32" class="step-label muted">DATA</text>
    <rect x="302" y="6" width="16" height="16" rx="8" class="step"/><text x="310" y="17" class="step-label ink">2</text><text x="310" y="32" class="step-label muted">ASK</text>
    <rect x="414" y="6" width="16" height="16" rx="8" class="step"/><text x="422" y="17" class="step-label ink">3</text><text x="422" y="32" class="step-label muted">CONFIRM</text>
    <rect x="526" y="6" width="16" height="16" rx="8" class="step-focus"/><text x="534" y="17" class="step-label" fill="#eb6c36">4</text><text x="534" y="32" class="step-label" fill="#eb6c36">RESULT</text>
    <rect x="638" y="6" width="16" height="16" rx="8" class="step"/><text x="646" y="17" class="step-label ink">5</text><text x="646" y="32" class="step-label muted">REVIEW</text>
    <rect x="750" y="6" width="16" height="16" rx="8" class="step"/><text x="758" y="17" class="step-label ink">6</text><text x="758" y="32" class="step-label muted">EXPORT</text>
  </g>

  <g class="lane-labels">
    <text x="70" y="79" class="lane-label muted">SCIENTIST</text>
    <text x="70" y="159" class="lane-label muted">APP SERVICES</text>
    <text x="70" y="239" class="lane-label muted">WORKER</text>
    <text x="70" y="319" class="lane-label muted">REVIEWERS</text>
  </g>

  <g class="connectors" fill="none">
    <line x1="248" y1="156" x2="260" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#workflow-arrow)"/>
    <path d="M472 156H526Q534 156 534 164V204" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#workflow-arrow-accent)"/>
    <path d="M584 236H638Q646 236 646 228V188" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#workflow-arrow-accent)"/>
    <line x1="696" y1="156" x2="708" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#workflow-arrow)"/>
    <path d="M696 316H750Q758 316 758 308V188" stroke="#4f5d75" stroke-width="1" marker-end="url(#workflow-arrow)"/>
  </g>

  <g class="nodes">
    <g><rect x="148" y="44" width="100" height="64" rx="6" class="node"/><rect x="152" y="48" width="14" height="10" rx="2" class="role"/><text x="159" y="55" class="role-key ink">SCI</text><text x="198" y="70" class="name ink">Upload CSV</text><text x="198" y="84" class="sub muted">permitted BDS</text></g>
    <g><rect x="148" y="124" width="100" height="64" rx="6" class="node"/><rect x="152" y="128" width="14" height="10" rx="2" class="role"/><text x="159" y="135" class="role-key ink">APP</text><text x="198" y="150" class="name ink">Parse + pin</text><text x="198" y="164" class="sub muted">BDS profile · snapshot</text><text x="198" y="176" class="tool soft">content hash</text></g>
    <g><rect x="260" y="44" width="100" height="64" rx="6" class="node"/><rect x="264" y="48" width="14" height="10" rx="2" class="role"/><text x="271" y="55" class="role-key ink">SCI</text><text x="310" y="70" class="name ink">Enter question</text><text x="310" y="84" class="sub muted">plot intent</text></g>
    <g><rect x="260" y="124" width="100" height="64" rx="6" class="node"/><rect x="264" y="128" width="14" height="10" rx="2" class="role"/><text x="271" y="135" class="role-key ink">APP</text><text x="310" y="150" class="name ink">Propose choices</text><text x="310" y="164" class="sub muted">candidate + source</text><text x="310" y="176" class="tool soft">no executable R</text></g>
    <g><rect x="372" y="44" width="100" height="64" rx="6" class="node"/><rect x="376" y="48" width="14" height="10" rx="2" class="role"/><text x="383" y="55" class="role-key ink">SCI</text><text x="422" y="70" class="name ink">Confirm choices</text><text x="422" y="84" class="sub muted">fields · levels · visits</text></g>
    <g><rect x="372" y="124" width="100" height="64" rx="6" class="node"/><rect x="376" y="128" width="14" height="10" rx="2" class="role"/><text x="383" y="135" class="role-key ink">APP</text><text x="422" y="150" class="name ink">Validate + compile</text><text x="422" y="164" class="sub muted">invalid blocks</text><text x="422" y="176" class="tool soft">Draft + attempt · hashes</text></g>
    <g><rect x="484" y="44" width="100" height="64" rx="6" class="node"/><rect x="488" y="48" width="14" height="10" rx="2" class="role"/><text x="495" y="55" class="role-key ink">SCI</text><text x="534" y="70" class="name ink">Inspect result</text><text x="534" y="84" class="sub muted">plot + status</text></g>
    <g><rect x="484" y="204" width="100" height="64" rx="6" class="node-focus"/><rect x="488" y="208" width="14" height="10" rx="2" class="role-focus"/><text x="495" y="215" class="role-key" fill="#eb6c36">WRK</text><text x="534" y="230" class="name ink">Clean callr worker</text><text x="534" y="244" class="sub muted">mirai · bounded manifest</text><text x="534" y="256" class="tool soft">error→Result · hashes</text></g>
    <g><rect x="596" y="124" width="100" height="64" rx="6" class="node"/><rect x="600" y="128" width="14" height="10" rx="2" class="role"/><text x="607" y="135" class="role-key ink">APP</text><text x="646" y="150" class="name ink">Attach + load</text><text x="646" y="164" class="sub muted">same revision · evidence</text><text x="646" y="176" class="tool soft">checks fail = Draft</text></g>
    <g><rect x="596" y="284" width="100" height="64" rx="6" class="node"/><rect x="600" y="288" width="14" height="10" rx="2" class="role"/><text x="607" y="295" class="role-key ink">REV</text><text x="646" y="310" class="name ink">Approve / reject</text><text x="646" y="324" class="sub muted">two distinct roles</text><text x="646" y="336" class="tool soft">creator excluded</text></g>
    <g><rect x="708" y="44" width="100" height="64" rx="6" class="node"/><rect x="712" y="48" width="14" height="10" rx="2" class="role"/><text x="719" y="55" class="role-key ink">SCI</text><text x="758" y="70" class="name ink">Choose workspace</text><text x="758" y="84" class="sub muted">registered name</text></g>
    <g><rect x="708" y="124" width="100" height="64" rx="6" class="node"/><rect x="712" y="128" width="14" height="10" rx="2" class="role"/><text x="719" y="135" class="role-key ink">APP</text><text x="758" y="150" class="name ink">Write receipt</text><text x="758" y="164" class="sub muted">pre-review policy open</text><text x="758" y="176" class="tool soft">Experimental blocked</text></g>
  </g>

  <g class="legend">
    <text x="144" y="374" class="legend-label muted">STAGES</text>
    <text x="204" y="374" class="legend-label ink">1 DATA</text><text x="292" y="374" class="legend-label ink">2 ASK</text><text x="376" y="374" class="legend-label ink">3 CONFIRM</text><text x="490" y="374" class="legend-label" fill="#eb6c36">4 RESULT</text><text x="602" y="374" class="legend-label ink">5 REVIEW</text><text x="710" y="374" class="legend-label ink">6 EXPORT</text>
    <text x="144" y="414" class="legend-label muted">FLOW</text>
    <line x1="190" y1="411" x2="224" y2="411" stroke="#4f5d75" stroke-width="1" marker-end="url(#workflow-arrow)"/><text x="234" y="414" class="legend-label muted">HANDOFF</text>
    <line x1="342" y1="411" x2="376" y2="411" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#workflow-arrow-accent)"/><text x="386" y="414" class="legend-label muted">FOCAL EXECUTION HANDOFF</text>
  </g>
</svg>
