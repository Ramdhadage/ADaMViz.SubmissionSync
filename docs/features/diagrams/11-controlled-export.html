<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controlled export | ADaMViz SubmissionSync</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Geist+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
:root{--navy:#0B3C5D;--slate:#5B6770;--paper:#f5f5f5;--sans:Inter,'Segoe UI',Arial,sans-serif;--mono:'Geist Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:white;color:var(--navy);font-family:var(--sans)}main{max-width:1024px;padding:28px 32px;margin:auto;min-width:0}h1{font-size:28px;margin:0 0 8px;font-weight:600}p{color:var(--slate);font-size:14px;line-height:1.5;margin:0 0 16px}.diagram-container{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:960px;background:var(--paper)}.node{fill:white;stroke:var(--slate);stroke-width:1;rx:6}.name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--navy)}.sub{font-family:var(--mono);font-size:9px;fill:var(--slate)}.tag,.label{font-family:var(--mono);font-size:8px;fill:var(--slate)}.line{fill:none;stroke:var(--navy);stroke-width:1.5;marker-end:url(#export11-arrow)}.note{font-family:var(--sans);font-size:11px;fill:var(--slate)}a{color:var(--navy)}footer{margin-top:16px;font-size:12px;color:var(--slate)}@media print{main{max-width:none;padding:0}.diagram-container{overflow:visible}svg{min-width:0;width:100%}}
</style>
</head>
<body><main>
<h1>Controlled export</h1>
<p>Accepted artifacts cross a checked publication boundary. ZIP download later reads the last successful export.</p>
<div class="diagram-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="11-controlled-export-title 11-controlled-export-desc">
<title id="11-controlled-export-title">Controlled export</title>
<desc id="11-controlled-export-desc">The export service checks eligibility and accepted artifacts before staged publication and internal receipt recording, while ZIP download separately copies the last successful pair without repeating those checks.</desc>
<defs><marker id="export11-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0B3C5D"/></marker></defs>
<rect x="28" y="68" width="904" height="340" rx="8" fill="#0B3C5D" fill-opacity=".025" stroke="#5B6770" stroke-dasharray="5 4"/>
<rect x="44" y="60" width="276" height="16" fill="#f5f5f5"/><text x="52" y="72" class="tag">DEVELOPMENT WORKSPACE PUBLICATION</text>
<!-- Connectors precede node boxes. All endpoints share an axis. -->
<path class="line" d="M284 150 H356"/>
<path class="line" d="M592 150 H664"/>
<path class="line" d="M782 192 V284"/>
<path class="line" d="M664 326 H592"/>
<path class="line" d="M356 326 H284" stroke-dasharray="5 4"/>
<rect x="292" y="126" width="56" height="16" fill="#f5f5f5"/><text x="320" y="137" text-anchor="middle" class="label">REQUEST</text>
<rect x="600" y="126" width="56" height="16" fill="#f5f5f5"/><text x="628" y="137" text-anchor="middle" class="label">ELIGIBLE</text>
<rect x="794" y="226" width="100" height="16" fill="#f5f5f5"/><text x="844" y="237" text-anchor="middle" class="label">RECHECK</text>
<rect x="600" y="302" width="56" height="16" fill="#f5f5f5"/><text x="628" y="313" text-anchor="middle" class="label">HASHES</text>
<rect x="292" y="302" width="56" height="16" fill="#f5f5f5"/><text x="320" y="313" text-anchor="middle" class="label">LATER</text>
<g><rect class="node" x="48" y="108" width="236" height="84"/><text x="64" y="128" class="tag">USER ACTION</text><text x="64" y="150" class="name">Export image and code</text><text x="64" y="170" class="sub">revision / actor / destination / version</text></g>
<g><rect class="node" x="356" y="108" width="236" height="84"/><text x="372" y="128" class="tag">SERVICE CHECKS</text><text x="372" y="150" class="name">Actor + status + accepted bundle</text><text x="372" y="170" class="sub">Draft / Verified / Reviewed only</text></g>
<g><rect class="node" x="664" y="108" width="236" height="84"/><text x="680" y="128" class="tag">STAGING</text><text x="680" y="150" class="name">Read and stage accepted bytes</text><text x="680" y="170" class="sub">script.R / plot.png / manifest.json</text></g>
<g><rect class="node" x="664" y="284" width="236" height="84"/><text x="680" y="304" class="tag">PUBLICATION</text><text x="680" y="326" class="name">Recheck and publish pair</text><text x="680" y="346" class="sub">stage hashes checked; manifest removed</text></g>
<g><rect class="node" x="356" y="284" width="236" height="84"/><text x="372" y="304" class="tag">INTERNAL EVIDENCE</text><text x="372" y="326" class="name">Record export receipt</text><text x="372" y="346" class="sub">revision / destination / hashes / time</text></g>
<g><rect class="node" x="48" y="284" width="236" height="84"/><text x="64" y="304" class="tag">SEPARATE DOWNLOAD</text><text x="64" y="326" class="name">ZIP last successful export</text><text x="64" y="346" class="sub">script.R + plot.png; no receipt or data</text></g>
<text x="48" y="448" class="note">Existing receipt: return before new authorization or version checks.</text>
<text x="48" y="472" class="note">ZIP download: no new eligibility or hash checks; current revision can differ.</text>
<text x="48" y="496" class="note">Blocked for new commands: Rejected, Experimental/Draft, missing bundle, or failed checks.</text>
<line x1="48" y1="536" x2="912" y2="536" stroke="#5B6770" stroke-opacity=".25"/>
<line x1="48" y1="560" x2="84" y2="560" stroke="#0B3C5D" stroke-width="1.5"/><text x="96" y="563" class="sub">Publication sequence</text>
<line x1="320" y1="560" x2="356" y2="560" stroke="#0B3C5D" stroke-width="1.5" stroke-dasharray="5 4"/><text x="368" y="563" class="sub">Later download</text>
<text x="624" y="563" class="sub">Local provider: development-only</text>
</svg></div>
<footer>Implementation guide, not validation evidence. Inter with Segoe UI/Arial fallback; Geist Mono for technical labels. <a href="../11-controlled-export.md">Read behavior and limits</a>.</footer>
</main></body></html>
