  <text x="622" y="169" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#263945">Permitted CSV / Excel file</text>

  <rect x="942" y="304" width="270" height="100" rx="8" fill="#fff" stroke="#9fabb4" stroke-width="2"/>
  <text x="962" y="333" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5b6770">LOCAL DESTINATION</text>
  <text x="962" y="361" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#263945">Development workspace</text>
  <text x="962" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#5b6770">script.R + plot.png</text>

  <line x1="64" y1="568" x2="1212" y2="568" stroke="#cbd4da"/>
  <text x="64" y="598" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b3c5d">BOUNDARY NOTES</text>
  <text x="64" y="625" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#425461">Upload compatibility is checked; file provenance and de-identification are not established.</text>
  <text x="64" y="650" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#425461">Reviewer identities are locally selectable. Workspace export is development-only; no qualified target is shown.</text>
  <text x="64" y="681" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#5b6770">Not FDA validated or FDA approved · file and workspace are artifacts, not software systems</text>
</svg>
