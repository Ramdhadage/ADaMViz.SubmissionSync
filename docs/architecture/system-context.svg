<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="context-title context-desc">
  <title id="context-title">ADaMViz SubmissionSync — C4 system context</title>
  <desc id="context-desc">A clinical scientist provides a permitted file and plotting choices to ADaMViz SubmissionSync. Statistical programmer and biostatistician reviewers record decisions. The system produces a local development export. File provenance and authentication are not established by the current app.</desc>
  <defs>
    <marker id="context-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#71808c"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f8fafb"/>
  <text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#0b3c5d">System context</text>
  <text x="64" y="99" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#5b6770">Current proof of concept · people, system boundary, and exchanged artifacts</text>

  <!-- Connections stay behind the nodes. -->
  <path d="M 334 248 H 412 V 320 H 462" fill="none" stroke="#71808c" stroke-width="2" marker-end="url(#context-arrow)"/>
  <path d="M 334 434 H 412 V 390 H 462" fill="none" stroke="#71808c" stroke-width="2" marker-end="url(#context-arrow)"/>
  <path d="M 622 180 V 250" fill="none" stroke="#71808c" stroke-width="2" marker-end="url(#context-arrow)"/>
  <path d="M 802 354 H 942" fill="none" stroke="#71808c" stroke-width="2" marker-end="url(#context-arrow)"/>
