  <rect x="346" y="370" width="112" height="22" fill="#f8fafb"/>
  <text x="402" y="385" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6770">REVIEW</text>
  <rect x="574" y="201" width="96" height="22" fill="#f8fafb"/>
  <text x="622" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6770">UPLOAD</text>
  <rect x="828" y="339" width="91" height="22" fill="#f8fafb"/>
  <text x="874" y="354" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6770">EXPORT</text>

  <rect x="64" y="198" width="270" height="100" rx="8" fill="#fff" stroke="#9fabb4" stroke-width="2"/>
  <text x="84" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5b6770">PERSON</text>
  <text x="84" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#263945">Clinical scientist</text>
  <text x="84" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#5b6770">Explores and confirms plots</text>

  <rect x="64" y="384" width="270" height="100" rx="8" fill="#fff" stroke="#9fabb4" stroke-width="2"/>
  <text x="84" y="412" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5b6770">PEOPLE</text>
  <text x="84" y="440" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#263945">Two reviewer roles</text>
  <text x="84" y="462" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6770">Statistical programming + biostatistics</text>

  <rect x="462" y="250" width="340" height="176" rx="8" fill="#e9f1f5" stroke="#0b3c5d" stroke-width="3"/>
  <text x="484" y="281" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#0b3c5d">SOFTWARE SYSTEM · CURRENT POC</text>
  <text x="484" y="321" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#0b3c5d">ADaMViz SubmissionSync</text>
  <text x="484" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#263945">R/Shiny plot generation and evidence</text>
  <text x="484" y="375" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#263945">Review decisions and controlled export</text>
  <text x="484" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6770">Designed for validated clinical submission workflows</text>

