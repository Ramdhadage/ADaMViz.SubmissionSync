<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="container-title container-desc">
  <title id="container-title">ADaMViz SubmissionSync — C4 container view</title>
  <desc id="container-desc">The installed R package runs a Shiny application that owns input, specification, compilation, evidence, review and export services. A synchronous clean callr subprocess executes generated R code. The coordinating application writes to SQLite evidence and a local artifact store, then publishes accepted script and plot files through a development-only workspace provider.</desc>
  <defs><marker id="container-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#71808c"/></marker></defs>
  <rect width="1280" height="720" fill="#f8fafb"/>
  <text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#0b3c5d">Container view</text>
  <text x="64" y="99" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#5b6770">Current runtime boundaries · internal R functions stay inside the Shiny container</text>

  <rect x="308" y="136" width="684" height="450" rx="8" fill="#f1f5f7" stroke="#9fabb4" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="332" y="164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#5b6770">ADAMVIZ SUBMISSIONSYNC · LOCAL RUNTIME</text>

  <!-- Relationships, drawn before nodes. -->
  <path d="M 276 292 H 352" fill="none" stroke="#71808c" stroke-width="2" marker-end="url(#container-arrow)"/>
