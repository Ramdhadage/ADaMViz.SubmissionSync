<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1020" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">ADaMViz SubmissionSync — C4 dynamic workflow</title>
  <desc id="flow-desc">Representative fixed-scale sequence: people upload data and confirm choices; the Shiny application records a Draft and invokes a callr worker; the application accepts the returned result and records evidence, showing a separately assembled preview. Two reviewers may approve. A permitted user can request export of an accepted bundle even without Reviewed status; the app checks hashes, publishes a development workspace pair, and records a receipt. Free-scale experimental revisions bypass the governed worker and cannot export.</desc>
  <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#71808c"/></marker></defs>
  <rect width="1280" height="1020" fill="#f8fafb"/>
  <text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#0b3c5d">Governed flow</text>
  <text x="64" y="99" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#5b6770">C4 dynamic / sequence view · representative fixed-scale path</text>

  <!-- Lifelines -->
  <g stroke="#c0cbd2" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="150" y1="180" x2="150" y2="885"/>
    <line x1="390" y1="180" x2="390" y2="885"/>
    <line x1="630" y1="180" x2="630" y2="885"/>
    <line x1="870" y1="180" x2="870" y2="885"/>
    <line x1="1110" y1="180" x2="1110" y2="885"/>
  </g>
  <rect x="54" y="132" width="192" height="48" rx="6" fill="#fff" stroke="#9fabb4" stroke-width="2"/>
  <text x="150" y="151" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6770">PEOPLE</text>
  <text x="150" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#263945">Scientist + reviewers</text>
  <rect x="294" y="132" width="192" height="48" rx="6" fill="#e9f1f5" stroke="#0b3c5d" stroke-width="2"/>
  <text x="390" y="151" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#0b3c5d">APPLICATION</text>
  <text x="390" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0b3c5d">R / Shiny</text>
  <rect x="534" y="132" width="192" height="48" rx="6" fill="#fff" stroke="#9fabb4" stroke-width="2"/>
  <text x="630" y="151" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6770">SUBPROCESS</text>
  <text x="630" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#263945">callr worker</text>
  <rect x="774" y="132" width="192" height="48" rx="6" fill="#fff" stroke="#9fabb4" stroke-width="2"/>
  <text x="870" y="151" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6770">LOCAL STORES</text>
  <text x="870" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#263945">Evidence + artifacts</text>
  <rect x="1014" y="132" width="192" height="48" rx="6" fill="#fff" stroke="#9fabb4" stroke-width="2"/>
  <text x="1110" y="151" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6770">LOCAL DESTINATION</text>
  <text x="1110" y="170" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#263945">Dev workspace</text>

  <!-- Twelve messages. White masks keep the labels clear of strokes. -->
  <g fill="none" stroke="#71808c" stroke-width="2" marker-end="url(#flow-arrow)">
    <path d="M 150 218 H 390"/>
    <path d="M 390 268 H 870"/>
    <path d="M 390 318 H 630"/>
    <path d="M 630 368 H 390" stroke-dasharray="5 4"/>
    <path d="M 390 418 H 870"/>
    <path d="M 390 468 H 150" stroke-dasharray="5 4"/>
    <path d="M 150 568 H 390"/>
    <path d="M 390 618 H 870"/>
    <path d="M 150 718 H 390"/>
    <path d="M 390 768 H 870"/>
    <path d="M 390 818 H 1110"/>
    <path d="M 390 868 H 870"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#425461">
    <rect x="206" y="204" width="130" height="22" fill="#f8fafb"/><text x="271" y="219">1 UPLOAD + ASK</text>
    <rect x="565" y="254" width="130" height="22" fill="#f8fafb"/><text x="630" y="269">2 RECORD DRAFT</text>
    <rect x="457" y="304" width="106" height="22" fill="#f8fafb"/><text x="510" y="319">3 RUN SCRIPT</text>
    <rect x="457" y="354" width="106" height="22" fill="#f8fafb"/><text x="510" y="369">4 RESULT</text>
    <rect x="555" y="404" width="150" height="22" fill="#f8fafb"/><text x="630" y="419">5 ACCEPT + VERIFY</text>
    <rect x="202" y="454" width="136" height="22" fill="#f8fafb"/><text x="270" y="469">6 PREVIEW</text>
    <rect x="202" y="554" width="136" height="22" fill="#f8fafb"/><text x="270" y="569">7 TWO APPROVALS</text>
    <rect x="555" y="604" width="150" height="22" fill="#f8fafb"/><text x="630" y="619">8 REVIEW STATUS</text>
    <rect x="202" y="704" width="136" height="22" fill="#f8fafb"/><text x="270" y="719">9 EXPORT ASK</text>
    <rect x="555" y="754" width="150" height="22" fill="#f8fafb"/><text x="630" y="769">10 HASH CHECK</text>
    <rect x="694" y="804" width="126" height="22" fill="#f8fafb"/><text x="757" y="819">11 PUBLISH PAIR</text>
    <rect x="555" y="854" width="150" height="22" fill="#f8fafb"/><text x="630" y="869">12 RECEIPT</text>
  </g>

  <rect x="72" y="513" width="1120" height="135" rx="6" fill="none" stroke="#9fabb4" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="84" y="502" width="168" height="22" fill="#f8fafb"/>
  <text x="92" y="517" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#5b6770">OPTIONAL HUMAN REVIEW</text>
  <text x="790" y="594" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#5b6770">Two distinct non-creator roles</text>

  <line x1="64" y1="915" x2="1216" y2="915" stroke="#cbd4da"/>
  <text x="64" y="941" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#425461">The UI preview is assembled separately from the accepted worker PNG. Failed checks leave the revision Draft.</text>
  <text x="64" y="963" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#425461">Code permits unreviewed Draft / Verified export with an accepted bundle; strategy requires unreviewed exports as drafts.</text>
  <text x="64" y="985" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#425461">Free-scale Experimental/Draft bypasses the worker and cannot enter governed verification or export.</text>
</svg>
