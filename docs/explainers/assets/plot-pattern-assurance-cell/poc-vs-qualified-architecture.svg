<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="ppac-arch-title ppac-arch-desc">
  <title id="ppac-arch-title">Local POC and qualified target architecture</title>
  <desc id="ppac-arch-desc">The same Shiny application and domain services use local providers for synthetic or de-identified data and mock services, while a qualified target uses approved clinical data, qualified identity, isolated execution, and controlled evidence and export storage.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

    <marker id="ppac-arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text x="48" y="64" fill="#2d3142" font-family="'Instrument Serif', Georgia, serif" font-size="28">Same application contract, different assurance boundary</text>
  <text x="48" y="92" fill="#4f5d75" font-family="Geist, Arial, sans-serif" font-size="12">The POC proves workflow behavior; production qualification belongs to sponsor-controlled providers and infrastructure.</text>

  <!-- zones -->
  <rect x="48" y="312" width="520" height="288" rx="8" fill="rgba(45,49,66,0.02)" stroke="#bfc0c0" stroke-width="1"/>
  <rect x="68" y="316" width="120" height="16" rx="2" fill="#f5f5f5"/>
  <text x="128" y="328" text-anchor="middle" fill="#7a8399" font-family="'Geist Mono', Consolas, monospace" font-size="8" letter-spacing="1.4">LOCAL POC</text>
  <rect x="616" y="312" width="616" height="288" rx="8" fill="rgba(235,108,54,0.03)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="636" y="316" width="156" height="16" rx="2" fill="#f5f5f5"/>
  <text x="714" y="328" text-anchor="middle" fill="#eb6c36" font-family="'Geist Mono', Consolas, monospace" font-size="8" letter-spacing="1.4">QUALIFIED TARGET</text>

  <!-- connectors -->
  <g fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#ppac-arch-arrow)">
    <path d="M 640 212 H 336 Q 328 212 328 220 V 344"/>
    <path d="M 640 212 H 928 Q 936 212 936 220 V 344"/>
    <path d="M 328 408 V 440 Q 328 448 320 448 H 188 V 476"/>
    <path d="M 328 408 V 440 Q 328 448 336 448 H 456 V 476"/>
    <path d="M 936 408 V 436 Q 936 444 928 444 H 760 V 464"/>
    <path d="M 936 408 V 436 Q 936 444 944 444 H 1108 V 464"/>
    <path d="M 936 408 V 516 Q 936 524 928 524 H 760 V 544"/>
    <path d="M 936 408 V 516 Q 936 524 944 524 H 1108 V 544"/>
  </g>

  <!-- components -->
  <g font-family="Geist, Arial, sans-serif" text-anchor="middle">
    <rect x="464" y="148" width="352" height="64" rx="8" fill="#fff" stroke="#2d3142" stroke-width="1.4"/>
    <text x="640" y="176" fill="#2d3142" font-size="12" font-weight="600">Same Shiny application and domain services</text>
    <text x="640" y="194" fill="#7a8399" font-family="'Geist Mono', Consolas, monospace" font-size="9">provider contracts stay stable</text>

    <rect x="216" y="344" width="224" height="64" rx="8" fill="#fff" stroke="#bfc0c0"/>
    <text x="328" y="380" fill="#2d3142" font-size="12" font-weight="600">Local POC providers</text>

    <rect x="824" y="344" width="224" height="64" rx="8" fill="#fff3ed" stroke="#eb6c36" stroke-width="1.4"/>
    <text x="936" y="380" fill="#2d3142" font-size="12" font-weight="600">Qualified target providers</text>

    <rect x="80" y="476" width="216" height="64" rx="8" fill="#fff" stroke="#bfc0c0"/>
    <text x="188" y="504" fill="#2d3142" font-size="12" font-weight="600">Synthetic or properly</text>
    <text x="188" y="520" fill="#2d3142" font-size="12" font-weight="600">de-identified data</text>

    <rect x="348" y="476" width="216" height="64" rx="8" fill="#fff" stroke="#bfc0c0"/>
    <text x="456" y="504" fill="#2d3142" font-size="12" font-weight="600">Mock prompt and local</text>
    <text x="456" y="520" fill="#2d3142" font-size="12" font-weight="600">evidence services</text>

    <rect x="652" y="464" width="216" height="64" rx="8" fill="#fff" stroke="#bfc0c0"/>
    <text x="760" y="492" fill="#2d3142" font-size="12" font-weight="600">Approved clinical-data</text>
    <text x="760" y="508" fill="#2d3142" font-size="12" font-weight="600">service</text>

    <rect x="1000" y="464" width="216" height="64" rx="8" fill="#fff" stroke="#bfc0c0"/>
    <text x="1108" y="492" fill="#2d3142" font-size="12" font-weight="600">Qualified identity</text>
    <text x="1108" y="508" fill="#2d3142" font-size="12" font-weight="600">and authorization</text>

    <rect x="652" y="544" width="216" height="64" rx="8" fill="#fff" stroke="#bfc0c0"/>
    <text x="760" y="572" fill="#2d3142" font-size="12" font-weight="600">Isolated execution</text>
    <text x="760" y="588" fill="#2d3142" font-size="12" font-weight="600">environment</text>

    <rect x="1000" y="544" width="216" height="64" rx="8" fill="#fff" stroke="#bfc0c0"/>
    <text x="1108" y="572" fill="#2d3142" font-size="12" font-weight="600">Controlled evidence and</text>
    <text x="1108" y="588" fill="#2d3142" font-size="12" font-weight="600">export storage</text>
  </g>

  <line x1="48" y1="660" x2="1232" y2="660" stroke="#bfc0c0" stroke-width="1"/>
  <rect x="56" y="678" width="28" height="16" rx="3" fill="none" stroke="#eb6c36" stroke-dasharray="4 3"/>
  <text x="96" y="690" fill="#4f5d75" font-family="Geist, Arial, sans-serif" font-size="10">Dashed coral boundary marks the qualified target environment; it is not claimed as implemented by the local POC.</text>
</svg>